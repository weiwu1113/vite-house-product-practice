<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
    <link   href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.min.css"   rel="stylesheet" />

    <title>detail</title>
  </head>
  <body>
    <%- include('./layout/header'); -%>

    <main>
      <section class="mx-5 mt-4 mb-5 rounded-5 m-lg-10 rounded-lg-6 overflow-hidden">
        <div class="row flex-column flex-lg-row g-1" id="image-gallery">
          <div class="col">            
            <a   href="https://github.com/hexschool/2022-web-layout-training/blob/main/2026-week8/detail-Image.png?raw=true"    data-pswp-width="1200"     data-pswp-height="800"     target="_blank"   >
              <img src="https://github.com/hexschool/2022-web-layout-training/blob/main/2026-week8/detail-Image.png?raw=true" alt="" class="w-100">
            </a>
          </div>
          <div class="col">
            <div class="row row-cols-lg-2 g-1">
              <div class="col">
                <img src="https://github.com/hexschool/2022-web-layout-training/blob/main/2026-week8/detail-Image-1.png?raw=true" alt="" class="w-100">
              </div>
              <div class="col">
                <img src="https://github.com/hexschool/2022-web-layout-training/blob/main/2026-week8/detail-Image-2.png?raw=true" alt="" class="w-100">
              </div>
              <div class="col">
                <img src="https://github.com/hexschool/2022-web-layout-training/blob/main/2026-week8/detail-Image-3.png?raw=true" alt="" class="w-100">
              </div>
              <div class="col">
                <div class="position-relative">
                  <img src="https://github.com/hexschool/2022-web-layout-training/blob/main/2026-week8/detail-Image-4.png?raw=true" alt="" class="w-100">
                  <!-- 手機版遮罩 -->
                   <div class="position-absolute w-100 h-100 top-0 star-0 bg-black bg-opacity-50 d-flex justify-content-center align-items-center d-lg-none">
                    <span class="material-symbols-outlined text-white fs-3">more_horiz</span>
                   </div>
                   <!-- 電腦版按鈕 -->
                    <div class="position-absolute more-image-btn d-none d-lg-block">
                      <button type="button" class="btn btn-gray-100 text-primary-dark fw-bold btn-standard rounded-3">
                        查看更多照片
                        <span class="material-symbols-outlined">arrow_forward</span>
                      </button>
                    </div>
                </div>
              </div>
            </div>
            
          </div>
        </div>
        
      </section>
    </main>

    <%- include('./layout/footer'); -%>

    <script type="module" src="../main.js"></script>
  </body>
</html>
